<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiet Places</title>

  <!-- Pretendard 폰트 (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 효과 3: 상단 스크롤 진행률 프로그래스 바 -->
  <div class="progress-bar" id="progressBar"></div>

  <!-- 히어로 -->
  <header class="hero">
    <!-- 효과 2: 패럴랙스가 적용되는 히어로 배경 이미지 -->
    <div class="hero-bg" id="heroBg"
         style="background-image: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=2000&q=80');">
    </div>
    <div class="hero-inner">
      <h1 class="hero-title fade-up">Quiet Places</h1>
      <p class="hero-text fade-up">
        잠시 멈추어 바라보는 풍경들.<br />
        천천히 스크롤하며 조용한 장소를 걸어보세요.
      </p>
    </div>
  </header>

  <main>
    <!-- 섹션 1 -->
    <section class="section">
      <div class="section-text">
        <h2 class="section-title fade-up">아침의 숲</h2>
        <p class="section-desc fade-up">
          나뭇잎 사이로 스며드는 첫 햇살.<br />
          고요한 숲은 하루를 가장 부드럽게 시작하게 합니다.
        </p>
      </div>
      <figure class="section-image fade-up">
        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1400&q=80"
             alt="햇살이 비치는 숲" loading="lazy" />
      </figure>
    </section>

    <!-- 섹션 2 -->
    <section class="section">
      <div class="section-text">
        <h2 class="section-title fade-up">안개 낀 산</h2>
        <p class="section-desc fade-up">
          멀리 겹겹이 이어지는 능선.<br />
          흐릿한 경계 속에서 오히려 마음이 선명해집니다.
        </p>
      </div>
      <figure class="section-image fade-up">
        <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1400&q=80"
             alt="안개 낀 산의 능선" loading="lazy" />
      </figure>
    </section>

    <!-- 섹션 3 -->
    <section class="section">
      <div class="section-text">
        <h2 class="section-title fade-up">해 질 녘 호수</h2>
        <p class="section-desc fade-up">
          하루의 끝, 물 위로 번지는 노을.<br />
          오늘의 풍경을 천천히 마음에 담아봅니다.
        </p>
      </div>
      <figure class="section-image fade-up">
        <img src="https://images.unsplash.com/photo-1501854140801-50d01698950b?auto=format&fit=crop&w=1400&q=80"
             alt="노을 진 풍경" loading="lazy" />
      </figure>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
